name: typecheck

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: pnpm typecheck

      # Blocks on critical advisories only: the high ones all arrive through
      # mermaid-cli and Puppeteer and cannot be fixed in this repository (#56).
      - run: pnpm audit --audit-level critical

  test:
    # Windows is the primary target of this tool, and the junction and
    # `npx.cmd` guarantees can only be verified there (#50).
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: pnpm test

  package:
    # Packs the npm package, installs the tarball into a throwaway global
    # prefix and converts a document with the installed command (#56). This is
    # the only job that runs doctoc and md-to-pdf for real, and the one that
    # notices a file missing from dist/.
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: pnpm build

      - name: Check the package contents
        id: pack
        shell: bash
        run: node scripts/pack-check.mjs "$RUNNER_TEMP/pack"

      # Ubuntu 24.04 forbids the unprivileged user namespaces Chromium's
      # sandbox needs; turning the restriction off beats running Chromium
      # without a sandbox.
      - name: Allow Chromium's sandbox
        if: runner.os == 'Linux'
        run: sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0

      - name: Install the tarball and convert a document
        shell: bash
        env:
          TARBALL: ${{ steps.pack.outputs.tarball }}
        run: node scripts/package-smoke.mjs "$TARBALL"
