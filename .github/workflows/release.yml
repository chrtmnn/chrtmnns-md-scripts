name: release

# Publishes @chrtmnn/md2pdf to npm when a v* tag is pushed (#56).
#
# `verify` builds, tests and packs the tarball; `publish` uploads exactly that
# tarball. The publish job installs no dependencies and runs no package
# scripts, so the one job holding the OIDC token executes nothing from the
# registry. It authenticates through npm Trusted Publishing — there is no npm
# token in this repository — and runs in the `npm` environment, whose
# protection rules (required reviewer, v* tags only) are configured in the
# repository settings.

on:
  push:
    tags: ['v*']

permissions: {}

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  verify:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      # No dependency cache: a release must not restore anything another
      # workflow run wrote.
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22

      - name: Check that the tag matches package.json
        run: |
          version="$(node -p "require('./package.json').version")"
          if [ "$GITHUB_REF_NAME" != "v$version" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match version $version in package.json"
            exit 1
          fi

      - run: pnpm install --frozen-lockfile

      - run: pnpm audit --audit-level critical

      - run: pnpm typecheck

      - run: pnpm test

      - run: pnpm build

      - name: Check the package contents
        id: pack
        run: node scripts/pack-check.mjs "$RUNNER_TEMP/pack"

      - name: Allow Chromium's sandbox
        run: sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0

      - name: Install the tarball and convert a document
        env:
          TARBALL: ${{ steps.pack.outputs.tarball }}
        run: node scripts/package-smoke.mjs "$TARBALL"

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: package
          path: ${{ steps.pack.outputs.tarball }}
          if-no-files-found: error
          retention-days: 7

  publish:
    needs: verify
    runs-on: ubuntu-latest
    environment: npm
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: package
          path: ${{ runner.temp }}/package

      # Node 24 ships an npm CLI with Trusted Publishing support.
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org

      - name: Require an npm CLI with Trusted Publishing
        run: |
          version="$(npm --version)"
          if ! printf '%s\n' 11.5.1 "$version" | sort -V -C; then
            echo "::error::npm $version cannot use Trusted Publishing; 11.5.1 or later is required"
            exit 1
          fi

      - name: Publish with provenance
        run: npm publish "$RUNNER_TEMP"/package/*.tgz --provenance --access public
